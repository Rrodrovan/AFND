spring.application.name=terrashift-backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/terrashift}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:terrashift}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Orígenes que pueden consultar la API desde el navegador (separados por comas).
# Por defecto: GitHub Pages del equipo y servidores locales de desarrollo.
terrashift.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://rrodrovan.github.io,http://localhost:8000,http://localhost:5500}

# Documentación OpenAPI / Swagger UI
springdoc.api-docs.path=/api/docs
springdoc.swagger-ui.path=/api/swagger-ui.html

# Token de administrador para aprobar zonas propuestas (cabecera X-Admin-Token).
# Si no se define, los endpoints /api/v1/admin/** quedan apagados.
terrashift.admin.token=${TERRASHIFT_ADMIN_TOKEN:}
