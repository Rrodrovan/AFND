openapi: 3.0.3
info:
  title: TerraShift API
  version: 0.1.0
  description: >
    API REST del backend de TerraShift. Esta especificación es la referencia de contrato;
    el backend también publica la suya en /api/docs y la interfaz en /api/swagger-ui.html.
servers:
  - url: http://localhost:8080
paths:
  /api/v1/health:
    get:
      summary: Estado del servicio y de la base de datos
      responses:
        "200":
          description: Servicio activo
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: up }
                  database: { type: string, enum: [up, down] }
  /api/v1/strategies:
    get:
      summary: Lista las estrategias de rotación
      responses:
        "200":
          description: Estrategias disponibles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Strategy"
  /api/v1/strategies/compare:
    get:
      summary: Compara las estrategias para una zona
      parameters:
        - name: zone
          in: query
          required: true
          description: Código de la zona (por ejemplo, piloto)
          schema: { type: string }
      responses:
        "200":
          description: Comparación por estrategia con sus indicadores
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComparisonResponse"
        "404":
          description: La zona no existe
  /api/v1/zones/{zone}/data-status:
    get:
      summary: Estado de las fuentes de datos de la NASA en una zona
      description: Hasta qué fecha llegan los datos de cada fuente y cómo fue la última sincronización.
      parameters:
        - { name: zone, in: path, required: true, schema: { type: string }, description: "Código de la zona (por ejemplo, piloto)" }
      responses:
        "200":
          description: Una entrada por fuente (power, smap, modis, landsat), también las que aún no tienen datos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataStatusResponse"
        "404":
          description: La zona no existe
  /api/v1/zones/{zone}/observations/monthly:
    get:
      summary: Series mensuales observadas (lluvia, temperatura, humedad del suelo, NDVI)
      parameters:
        - { name: zone, in: path, required: true, schema: { type: string } }
        - name: months
          in: query
          required: false
          description: Cuántos meses hacia atrás (1 a 240; por defecto 24)
          schema: { type: integer, default: 24, minimum: 1, maximum: 240 }
      responses:
        "200":
          description: Un elemento por mes con datos; las variables sin dato ese mes vienen en null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObservationsResponse"
        "404":
          description: La zona no existe
  /api/v1/zones:
    get:
      summary: Zonas aprobadas
      description: Solo las zonas aprobadas son públicas. Las pendientes y rechazadas no aparecen.
      responses:
        "200":
          description: Lista de zonas con su caja (oeste, sur, este, norte)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ZoneSummary" }
  /api/v1/zones/requests:
    post:
      summary: Propone una zona nueva (queda pendiente de aprobación)
      description: >
        No se descarga ningún dato hasta que un administrador la apruebe. Límites: dentro de Nicaragua,
        entre 0,02° y 0,5° por lado, 5 solicitudes por hora por origen y un máximo de 20 pendientes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ZoneRequest" }
      responses:
        "201":
          description: Solicitud registrada (estado pending)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZoneSummary" }
        "400":
          description: 'Datos inválidos; el cuerpo trae {"error": "mensaje"}'
        "429":
          description: Demasiadas solicitudes (por origen o pendientes en total)
  /api/v1/admin/zones/pending:
    get:
      summary: Solicitudes pendientes (administrador)
      parameters:
        - { name: X-Admin-Token, in: header, required: true, schema: { type: string } }
      responses:
        "200":
          description: Zonas pendientes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ZoneSummary" }
        "401": { description: Token inválido }
        "404": { description: Administración desactivada en el servidor (sin TERRASHIFT_ADMIN_TOKEN) }
        "429": { description: Demasiados intentos fallidos }
  /api/v1/admin/zones/{code}/approve:
    post:
      summary: Aprueba una zona pendiente (administrador)
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
        - { name: X-Admin-Token, in: header, required: true, schema: { type: string } }
      responses:
        "200":
          description: Zona aprobada; la sincronización diaria empezará a descargar sus datos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZoneSummary" }
        "401": { description: Token inválido }
        "404": { description: No hay una solicitud pendiente con ese código }
  /api/v1/admin/zones/{code}/reject:
    post:
      summary: Rechaza una zona pendiente (administrador)
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
        - { name: X-Admin-Token, in: header, required: true, schema: { type: string } }
      responses:
        "200":
          description: Zona rechazada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZoneSummary" }
        "401": { description: Token inválido }
        "404": { description: No hay una solicitud pendiente con ese código }
components:
  schemas:
    Strategy:
      type: object
      properties:
        id: { type: integer }
        code: { type: string, example: E1 }
        name: { type: string }
        focus: { type: string }
    Indicator:
      type: object
      properties:
        crop: { type: string }
        scenario: { type: string, enum: [normal, seco, canicula] }
        indicator: { type: string }
        value: { type: number, nullable: true }
        min: { type: number, nullable: true }
        max: { type: number, nullable: true }
        unit: { type: string, nullable: true }
    StrategyComparison:
      type: object
      properties:
        strategy: { $ref: "#/components/schemas/Strategy" }
        indicators:
          type: array
          items: { $ref: "#/components/schemas/Indicator" }
    ComparisonResponse:
      type: object
      properties:
        zone: { type: string }
        strategies:
          type: array
          items: { $ref: "#/components/schemas/StrategyComparison" }
        note: { type: string }
    DataSourceStatus:
      type: object
      properties:
        source: { type: string, enum: [power, smap, modis, landsat] }
        label: { type: string }
        firstDate: { type: string, format: date, nullable: true }
        lastDate: { type: string, format: date, nullable: true }
        rows: { type: integer, format: int64 }
        lastSyncOkAt: { type: string, format: date-time, nullable: true }
        lastRunStatus: { type: string, enum: [ok, up_to_date, error], nullable: true }
        lastRunAt: { type: string, format: date-time, nullable: true }
    DataStatusResponse:
      type: object
      properties:
        zone: { type: string }
        sources:
          type: array
          items: { $ref: "#/components/schemas/DataSourceStatus" }
    MonthlyObservation:
      type: object
      properties:
        month: { type: string, format: date, description: Primer día del mes }
        precipMmTotal: { type: number, nullable: true }
        precipDays: { type: integer, format: int64, nullable: true, description: Días del mes con dato de lluvia }
        t2mMeanC: { type: number, nullable: true }
        surfaceM3m3Mean: { type: number, nullable: true }
        rootzoneM3m3Mean: { type: number, nullable: true }
        ndviModisMean: { type: number, nullable: true }
        ndviLandsatMean: { type: number, nullable: true }
    ObservationsResponse:
      type: object
      properties:
        zone: { type: string }
        months:
          type: array
          items: { $ref: "#/components/schemas/MonthlyObservation" }
    ZoneSummary:
      type: object
      properties:
        code: { type: string, example: somoto-madriz-1a2b }
        name: { type: string }
        minLon: { type: number }
        minLat: { type: number }
        maxLon: { type: number }
        maxLat: { type: number }
        status: { type: string, enum: [pending, approved, rejected] }
    ZoneRequest:
      type: object
      required: [name, minLon, minLat, maxLon, maxLat]
      properties:
        name: { type: string, minLength: 3, maxLength: 60 }
        minLon: { type: number, description: Oeste, minimum: -88.0 }
        minLat: { type: number, description: Sur, minimum: 10.5 }
        maxLon: { type: number, description: Este, maximum: -82.5 }
        maxLat: { type: number, description: Norte, maximum: 15.5 }
