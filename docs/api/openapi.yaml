openapi: 3.0.3
info:
  title: TerraShift API
  version: 0.1.0
  description: >
    API REST del backend de TerraShift. Esta especificación es la referencia de contrato;
    el backend también publica la suya en /api/docs y la interfaz en /api/swagger-ui.html.
servers:
  - url: http://localhost:8080
paths:
  /api/v1/health:
    get:
      summary: Estado del servicio y de la base de datos
      responses:
        "200":
          description: Servicio activo
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: up }
                  database: { type: string, enum: [up, down] }
  /api/v1/strategies:
    get:
      summary: Lista las estrategias de rotación
      responses:
        "200":
          description: Estrategias disponibles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Strategy"
  /api/v1/strategies/compare:
    get:
      summary: Compara las estrategias para una zona
      parameters:
        - name: zone
          in: query
          required: true
          description: Código de la zona (por ejemplo, piloto)
          schema: { type: string }
      responses:
        "200":
          description: Comparación por estrategia con sus indicadores
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComparisonResponse"
        "404":
          description: La zona no existe
  /api/v1/zones/{zone}/data-status:
    get:
      summary: Estado de las fuentes de datos de la NASA en una zona
      description: Hasta qué fecha llegan los datos de cada fuente y cómo fue la última sincronización.
      parameters:
        - { name: zone, in: path, required: true, schema: { type: string }, description: "Código de la zona (por ejemplo, piloto)" }
      responses:
        "200":
          description: Una entrada por fuente (power, smap, modis, landsat), también las que aún no tienen datos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataStatusResponse"
        "404":
          description: La zona no existe
  /api/v1/zones/{zone}/observations/monthly:
    get:
      summary: Series mensuales observadas (lluvia, temperatura, humedad del suelo, NDVI)
      parameters:
        - { name: zone, in: path, required: true, schema: { type: string } }
        - name: months
          in: query
          required: false
          description: Cuántos meses hacia atrás (1 a 240; por defecto 24)
          schema: { type: integer, default: 24, minimum: 1, maximum: 240 }
      responses:
        "200":
          description: Un elemento por mes con datos; las variables sin dato ese mes vienen en null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObservationsResponse"
        "404":
          description: La zona no existe
components:
  schemas:
    Strategy:
      type: object
      properties:
        id: { type: integer }
        code: { type: string, example: E1 }
        name: { type: string }
        focus: { type: string }
    Indicator:
      type: object
      properties:
        crop: { type: string }
        scenario: { type: string, enum: [normal, seco, canicula] }
        indicator: { type: string }
        value: { type: number, nullable: true }
        min: { type: number, nullable: true }
        max: { type: number, nullable: true }
        unit: { type: string, nullable: true }
    StrategyComparison:
      type: object
      properties:
        strategy: { $ref: "#/components/schemas/Strategy" }
        indicators:
          type: array
          items: { $ref: "#/components/schemas/Indicator" }
    ComparisonResponse:
      type: object
      properties:
        zone: { type: string }
        strategies:
          type: array
          items: { $ref: "#/components/schemas/StrategyComparison" }
        note: { type: string }
    DataSourceStatus:
      type: object
      properties:
        source: { type: string, enum: [power, smap, modis, landsat] }
        label: { type: string }
        firstDate: { type: string, format: date, nullable: true }
        lastDate: { type: string, format: date, nullable: true }
        rows: { type: integer, format: int64 }
        lastSyncOkAt: { type: string, format: date-time, nullable: true }
        lastRunStatus: { type: string, enum: [ok, up_to_date, error], nullable: true }
        lastRunAt: { type: string, format: date-time, nullable: true }
    DataStatusResponse:
      type: object
      properties:
        zone: { type: string }
        sources:
          type: array
          items: { $ref: "#/components/schemas/DataSourceStatus" }
    MonthlyObservation:
      type: object
      properties:
        month: { type: string, format: date, description: Primer día del mes }
        precipMmTotal: { type: number, nullable: true }
        precipDays: { type: integer, format: int64, nullable: true, description: Días del mes con dato de lluvia }
        t2mMeanC: { type: number, nullable: true }
        surfaceM3m3Mean: { type: number, nullable: true }
        rootzoneM3m3Mean: { type: number, nullable: true }
        ndviModisMean: { type: number, nullable: true }
        ndviLandsatMean: { type: number, nullable: true }
    ObservationsResponse:
      type: object
      properties:
        zone: { type: string }
        months:
          type: array
          items: { $ref: "#/components/schemas/MonthlyObservation" }
